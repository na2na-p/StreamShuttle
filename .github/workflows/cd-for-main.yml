name: "CD for main"

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-ci:
    uses: ./.github/workflows/app-ci.yml
    secrets: inherit

  build-and-push:
    needs: app-ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        platform:
          - linux/arm64
          - linux/amd64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Login to registry.na2na.dev
        run: |
          echo "${{ secrets.REGISTRY_NA2NA_DEV_BOT_KEY }}" | docker login registry.na2na.dev -u 'robot$applications+streamshuttle-ci' --password-stdin

      - name: Set platform suffix
        id: platform
        run: |
          # linux/arm64 -> arm64, linux/amd64 -> amd64
          PLATFORM_SUFFIX=$(echo ${{ matrix.platform }} | cut -d'/' -f2)
          echo "suffix=${PLATFORM_SUFFIX}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        env:
          DOCKER_BUILDKIT: 1
        run: |
          # Use regular docker build + push (buildx has auth issues with registry.na2na.dev)
          docker build --platform ${{ matrix.platform }} \
            --target production \
            -t registry.na2na.dev/applications/streamshuttle:$GITHUB_SHA-${{ steps.platform.outputs.suffix }} \
            -t registry.na2na.dev/applications/streamshuttle:latest-${{ steps.platform.outputs.suffix }} \
            .

          docker push registry.na2na.dev/applications/streamshuttle:$GITHUB_SHA-${{ steps.platform.outputs.suffix }}
          docker push registry.na2na.dev/applications/streamshuttle:latest-${{ steps.platform.outputs.suffix }}

  create-manifest:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.output_tags.outputs.image_tag }}
    steps:
      - name: Login to registry.na2na.dev
        run: |
          echo "${{ secrets.REGISTRY_NA2NA_DEV_BOT_KEY }}" | docker login registry.na2na.dev -u 'robot$applications+streamshuttle-ci' --password-stdin

      - name: Create and push manifest list
        run: |
          docker manifest create registry.na2na.dev/applications/streamshuttle:$GITHUB_SHA \
            registry.na2na.dev/applications/streamshuttle:$GITHUB_SHA-arm64 \
            registry.na2na.dev/applications/streamshuttle:$GITHUB_SHA-amd64
          docker manifest push registry.na2na.dev/applications/streamshuttle:$GITHUB_SHA

          docker manifest create registry.na2na.dev/applications/streamshuttle:latest \
            registry.na2na.dev/applications/streamshuttle:latest-arm64 \
            registry.na2na.dev/applications/streamshuttle:latest-amd64
          docker manifest push registry.na2na.dev/applications/streamshuttle:latest

      - name: Output image tags
        id: output_tags
        run: |
          echo "image_tag=$GITHUB_SHA" >> $GITHUB_OUTPUT

          echo "## 🐳 ビルド済みDockerイメージ" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| タグ | イメージURI |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-----------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`$GITHUB_SHA\` | \`registry.na2na.dev/applications/streamshuttle:$GITHUB_SHA\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`latest\` | \`registry.na2na.dev/applications/streamshuttle:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 イメージ詳細" >> $GITHUB_STEP_SUMMARY
          echo "- **プラットフォーム**: linux/arm64, linux/amd64" >> $GITHUB_STEP_SUMMARY
          echo "- **ベースイメージ**: python:3.14.0-slim" >> $GITHUB_STEP_SUMMARY
          echo "- **コミット**: $GITHUB_SHA" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 プルコマンド" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull registry.na2na.dev/applications/streamshuttle:$GITHUB_SHA" >> $GITHUB_STEP_SUMMARY
          echo "# または" >> $GITHUB_STEP_SUMMARY
          echo "docker pull registry.na2na.dev/applications/streamshuttle:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  display-results:
    needs: create-manifest
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Display Deploy Results
        run: |
          echo "## 🚀 デプロイ結果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.create-manifest.result }}" = "success" ]; then
            echo "✅ **イメージビルド**: 正常に完了しました" >> $GITHUB_STEP_SUMMARY
            echo "   - イメージタグ: \`${{ needs.create-manifest.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
            echo "   - イメージURI: \`registry.na2na.dev/applications/streamshuttle:${{ needs.create-manifest.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **イメージビルド**: 失敗しました" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**全体ステータス**: ${{ needs.create-manifest.result }}" >> $GITHUB_STEP_SUMMARY
