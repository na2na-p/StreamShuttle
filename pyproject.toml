[project]
name = "streamshuttle"
version = "1.0.0"
description = "YouTube URL resolver and proxy service for VRChat video players"
readme = "README.md"
requires-python = ">=3.14.3"
dependencies = [
    "fastapi>=0.131.0,<0.132.0",
    "yt-dlp>=2026.2.21,<2026.2.22",
    "yt-dlp-ejs>=0.5.0,<0.5.1",
    "redis>=7.2.0,<7.2.1",
    "uvicorn[standard]>=0.41.0,<0.41.1",
    "pydantic>=2.12.5,<3.0.0",
    "pydantic-settings>=2.13.1,<3.0.0",
    "python-dotenv>=1.2.1,<2.0.0",
    "slowapi>=0.1.9,<0.2.0",
    "jinja2>=3.1.6,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2,<9.0.3",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "pytest-mock>=3.15.1,<4.0.0",
    "ruff>=0.15.2,<0.15.3",
    "httpx>=0.28.1,<0.29.0",
    "fakeredis>=2.34.0,<3.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=82.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
