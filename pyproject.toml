[project]
name = "streamshuttle"
version = "1.0.0"
description = "YouTube URL resolver and proxy service for VRChat video players"
readme = "README.md"
requires-python = ">=3.14.7"
dependencies = [
    "fastapi>=0.162.0,<0.162.1",
    "yt-dlp>=2026.10.26,<2026.10.27",
    "yt-dlp-ejs>=0.8.0,<0.8.1",
    "redis>=8.1.0,<8.1.1",
    "uvicorn[standard]>=0.54.0,<0.54.1",
    "pydantic>=2.14.2,<3.0.0",
    "pydantic-settings>=2.16.2,<3.0.0",
    "python-dotenv>=1.2.4,<2.0.0",
    "slowapi>=0.1.10,<0.2.0",
    "jinja2>=3.1.6,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0,<9.2.1",
    "pytest-asyncio>=1.4.1,<2.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "pytest-mock>=3.17.0,<4.0.0",
    "ruff>=0.17.3,<0.17.4",
    "httpx>=0.28.1,<0.29.0",
    "fakeredis>=2.40.0,<3.0.0",
]

[tool.uv]
exclude-newer = "1 week"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
