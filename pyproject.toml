[project]
name = "streamshuttle"
version = "1.0.0"
description = "YouTube URL resolver and proxy service for VRChat video players"
readme = "README.md"
requires-python = ">=3.14.6"
dependencies = [
    "fastapi>=0.136.3,<0.136.4",
    "yt-dlp>=2026.6.9,<2026.6.10",
    "yt-dlp-ejs>=0.8.0,<0.8.1",
    "redis>=8.0.0,<8.0.1",
    "uvicorn[standard]>=0.49.0,<0.49.1",
    "pydantic>=2.13.4,<3.0.0",
    "pydantic-settings>=2.14.1,<3.0.0",
    "python-dotenv>=1.2.2,<2.0.0",
    "slowapi>=0.1.10,<0.2.0",
    "jinja2>=3.1.6,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<9.0.4",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "pytest-mock>=3.15.1,<4.0.0",
    "ruff>=0.15.17,<0.15.18",
    "httpx>=0.28.1,<0.29.0",
    "fakeredis>=2.36.1,<3.0.0",
]

[tool.uv]
exclude-newer = "1 week"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
