{% extends "base.html" %}

{% block title %}プレイリストプレイヤー - StreamShuttle{% endblock %}

{% block content %}
<section class="player-section">
  <form id="playlist-form">
    <label for="playlist-url-input">YouTube公開プレイリストURL:</label>
    <input
      type="url"
      id="playlist-url-input"
      name="url"
      placeholder="https://www.youtube.com/playlist?list=..."
      required
    >
    <button type="button" id="load-playlist-btn">プレイリスト読み込み</button>
  </form>

  <div id="player-error" class="error hidden"></div>
  <div id="player-notice" class="notice hidden"></div>

  <div id="player-container" class="hidden">
    <div class="playlist-header">
      <h2 id="playlist-title"></h2>
      <p id="playlist-meta" class="playlist-meta"></p>
    </div>

    <video id="video-player" class="video-player" controls playsinline preload="metadata"></video>
    <img id="audio-artwork" class="audio-artwork hidden" alt="">
    <audio id="audio-player" class="audio-player hidden" controls preload="metadata"></audio>

    <p id="now-playing" class="now-playing"></p>

    <div class="player-controls">
      <button type="button" id="shuffle-btn" class="icon-btn" aria-pressed="false" aria-label="シャッフル" title="シャッフル">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
      </button>
      <button type="button" id="prev-btn" class="icon-btn" aria-label="前の曲" title="前の曲">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button type="button" id="play-btn" class="icon-btn play-btn" aria-label="再生" title="再生">
        <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button type="button" id="next-btn" class="icon-btn" aria-label="次の曲" title="次の曲">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
      <button type="button" id="repeat-btn" class="icon-btn" data-mode="all" aria-pressed="true" aria-label="リピート: 全曲" title="リピート: 全曲">
        <svg class="icon-repeat" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
        <svg class="icon-repeat-one" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-4-2V9h-1l-2 1v1h1.5v4H13z"/></svg>
      </button>
      <span class="control-separator" aria-hidden="true"></span>
      <button type="button" id="audio-only-btn" class="icon-btn" aria-pressed="false" aria-label="音声のみ" title="音声のみ（画面オフでも再生）">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0-9 9v7c0 1.1.9 2 2 2h4v-8H5v-1a7 7 0 0 1 14 0v1h-4v8h4c1.1 0 2-.9 2-2v-7a9 9 0 0 0-9-9z"/></svg>
      </button>
    </div>

    <ol id="playlist-items" class="playlist-items"></ol>
  </div>
</section>
{% endblock %}

{% block scripts %}<script src="/static/js/player.js"></script>{% endblock %}
